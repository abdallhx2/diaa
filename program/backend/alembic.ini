# ============================================================
# File: alembic.ini
# Purpose: إعدادات Alembic لإدارة migrations قاعدة البيانات
# Owner: فاطمة — Database Lead
# Branch: feature/backend-models
# Week: Week 1 — إعداد قاعدة البيانات
# ============================================================

[alembic]

# مسار مجلد الـ migrations
script_location = alembic

# رابط قاعدة البيانات — يُقرأ من متغير البيئة DATABASE_URL
# ملاحظة: هذا الرابط يتم تجاوزه في env.py ليقرأ من config.py
sqlalchemy.url = postgresql://user:password@localhost:5432/edu_db

# تنسيق أسماء ملفات الـ migration
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# عرض الـ SQL بدل تنفيذه مباشرة (للتطوير)
# sqlalchemy.echo = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# --- Notes ---
# - شغلي migration جديد: alembic revision --autogenerate -m "وصف التغيير"
# - طبقي الـ migrations: alembic upgrade head
# - ارجعي خطوة: alembic downgrade -1
# - في env.py: عدلي عشان يقرأ DATABASE_URL من app.config.settings
# - لا تنسي تستوردين كل الموديلات في models/__init__.py عشان autogenerate يشتغل
