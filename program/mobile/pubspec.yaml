name: edu_smart_assistant
description: المساعد التعليمي الذكي — تطبيق تعليمي للمنهج السعودي يساعد الأطفال في القراءة والكتابة والاستيعاب
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State Management ---
  provider: ^6.1.1

  # --- HTTP & Networking ---
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # --- Firebase ---
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  firebase_storage: ^12.4.0

  # --- Camera & Scanner ---
  camera: ^0.10.5+9
  mobile_scanner: ^4.0.1
  image_picker: ^1.0.7

  # --- Audio ---
  just_audio: ^0.9.36
  audio_video_progress_bar: ^2.0.3

  # --- UI & Design ---
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0

  # --- Charts & Visualization ---
  fl_chart: ^0.66.2

  # --- Localization & Formatting ---
  intl: ^0.20.2

  # --- Local Storage ---
  shared_preferences: ^2.2.2
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
